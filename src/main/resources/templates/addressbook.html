<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Address Book</title></head>
<body>
<a th:href="@{/}">Back to all address books</a>
<h1>Address Book #<span th:text="${book.id}"></span></h1>
<table border="1">
    <tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Gender</th></tr>
    <tr th:each="buddy : ${book.buddies}">
        <td th:text="${buddy.name}"></td>
        <td th:text="${buddy.phoneNumber}"></td>
        <td th:text="${buddy.email}"></td>
        <td th:text="${buddy.address}"></td>
        <td th:text="${buddy.gender}"></td>
    </tr>
</table>

<h2>Add a buddy</h2>
<form th:action="@{/view/addressbook/{id}/buddy(id=${book.id})}" method="post">
    Name: <input type="text" name="name" required><br>
    Phone: <input type="text" name="phoneNumber"><br>
    Email: <input type="text" name="email"><br>
    Address: <input type="text" name="address"><br>
    Gender: <input type="text" name="gender"><br>
    <button type="submit">Add buddy</button>
</form>

</body>
</html>
